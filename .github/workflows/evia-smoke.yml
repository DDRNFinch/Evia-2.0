name: Evia smoke tests

on:
  push:
    branches:
      - main
      - technical-consolidation-v80
      - epa-menu-v81
      - epa-zone-v82
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: evia-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Check EPA worker syntax
        run: node --check cloudflare-ai/worker-v5.js

      - name: Run Evia smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evia-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
