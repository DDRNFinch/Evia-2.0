name: Verify Evia Cloudflare AI worker

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-ai/**'
      - '.github/workflows/cloudflare-epa-worker.yml'

permissions:
  contents: read

concurrency:
  group: evia-cloudflare-worker-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Cloudflare-connected deployment and EPA generation
        run: |
          node - <<'NODE'
          const base = 'https://evia-teach-test.finchyisnow.workers.dev';
          const expectedModel = '@cf/nvidia/nemotron-3-120b-a12b';
          const expectedEngine = 'native-json-fallback-v1';
          let last = '';

          for (let i = 0; i < 60; i++) {
            try {
              const response = await fetch(`${base}/health`, { cache: 'no-store' });
              last = await response.text();
              if (response.ok) {
                const data = JSON.parse(last);
                if (data.epaModel === expectedModel && data.epaEngineVersion === expectedEngine) {
                  console.log('Verified Cloudflare EPA engine:', data.epaEngineVersion);
                  console.log('Primary model:', data.epaModel);
                  console.log('Fallback model:', data.epaFallbackModel || 'not reported');
                  console.log('Structured fallback:', data.epaStructuredFallbackModel || 'not reported');
                  break;
                }
              }
            } catch (error) {
              last = String(error);
            }
            if (i === 59) {
              console.error('Cloudflare-connected EPA deployment was not verified:', last);
              process.exit(1);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }

          const payload = {
            action: 'question',
            practiceType: 'discussion',
            assessmentMethod: {
              title: 'Professional discussion deployment check',
              detail: 'Ask one demanding assessor-style question.'
            },
            course: {
              courseId: 'EVIA-DEPLOYMENT-CHECK',
              courseTitle: 'EPA deployment verification',
              courseType: 'standard',
              level: '2',
              criteria: [
                {
                  code: 'K1',
                  label: 'Checks work against an approved specification and explains corrective action.',
                  requirement: 'Explain how work is checked against the specification and what action is taken when it is outside requirements.'
                }
              ]
            },
            evidence: [],
            previousQuestions: []
          };

          let generated = '';
          for (let attempt = 1; attempt <= 2; attempt++) {
            try {
              const response = await fetch(`${base}/v1/epa-discussion`, {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  'origin': 'https://ddrnfinch.github.io'
                },
                body: JSON.stringify(payload)
              });
              generated = await response.text();
              const data = JSON.parse(generated);
              if (response.ok && data.ok === true && data.action === 'question' && typeof data.question === 'string' && data.question.trim().length > 20) {
                console.log('Verified live EPA question generation with model:', data.model || 'not reported');
                console.log('Question length:', data.question.trim().length);
                process.exit(0);
              }
            } catch (error) {
              generated = String(error);
            }
            if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 5000));
          }

          console.error('Live EPA question generation failed:', generated);
          process.exit(1);
          NODE
