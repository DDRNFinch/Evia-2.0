    function naxosCaptureType(value) {
      const text = cleanText(value).toLowerCase();
      if (/witness|testimony/.test(text)) return 'witness';
      if (/video|photo|camera/.test(text)) return 'camera';
      if (/audio|voice|reflection|microphone/.test(text)) return 'audio';
      return 'text';
    }

    function naxosPreferredOption(profile) {
      const preferred = Array.isArray(profile?.preferred) ? profile.preferred : [];
      if (!preferred.length) return { label: 'Written evidence', type: 'text', details: [] };
      const details = preferred.map((item) => ({
        displayType: evidenceTypeDisplayLabel(item?.type),
        label: cleanText(item?.label),
        instruction: cleanText(item?.instruction)
      }));
      const label = preferred.map((item) => cleanText(item?.label || item?.type)).filter(Boolean).join(' + ') || 'Recommended evidence';
      const typeSource = preferred.map((item) => `${item?.type || ''} ${item?.label || ''} ${item?.instruction || ''}`).join(' ');
      return { label, type: naxosCaptureType(typeSource), details };
    }

    function naxosAlternativeOption(profile) {
      const alternative = Array.isArray(profile?.alternatives) ? profile.alternatives[0] : null;
      if (!alternative) return null;
      const label = cleanText(alternative.label) || 'Alternative evidence';
      return {
        label,
        type: naxosCaptureType(`${label} ${alternative.instruction || ''}`),
        details: [{ displayType: evidenceTypeDisplayLabel(alternative.type), label, instruction: cleanText(alternative.instruction) }]
      };
    }

    function naxosTaskRequirements(task, registry, profile) {
      const items = Array.isArray(profile?.capture) ? profile.capture.map(cleanText).filter(Boolean) : [];
      const prompt = cleanText(task?.conditionalPrompt);
      if (prompt) items.push(prompt);
      return items;
    }

    function naxosEvidenceFromPatch(value) {
      if (!Array.isArray(value)) return null;
      const profileId = cleanText(value[0]);
      const rows = Array.isArray(value[1]) ? value[1] : [];
      const preferred = rows.map((row) => ({
        type: cleanText(row?.[0]),
        label: cleanText(row?.[1]),
        instruction: cleanText(row?.[2])
      })).filter((item) => item.type || item.label || item.instruction);
      const evidence = {};
      if (profileId) evidence.profileId = profileId;
      if (preferred.length) evidence.preferred = preferred;
      return Object.keys(evidence).length ? evidence : null;
    }

    function naxosExpandedRequirements(targets, facets) {
      const items = facets?.items || {};
      return (targets || []).flatMap((id) => {
        const rows = Array.isArray(items[id]) ? items[id] : [];
        return rows.length ? rows.map((row) => `${id}.${cleanText(row?.[0])}`).filter((value) => !value.endsWith('.')) : [id];
      });
    }

    function applyNaxosKsbPatch(categories, patch, facets) {
      const cloned = JSON.parse(JSON.stringify(categories || []));
      const compact = patch && typeof patch === 'object' ? patch : {};

      (Array.isArray(compact.c) ? compact.c : []).forEach((row) => {
        const ci = Number(row?.[0]), title = cleanText(row?.[1]);
        if (Number.isInteger(ci) && cloned[ci] && title) cloned[ci].title = title;
      });
      (Array.isArray(compact.s) ? compact.s : []).forEach((row) => {
        const ci = Number(row?.[0]), si = Number(row?.[1]), title = cleanText(row?.[2]);
        const subcategory = cloned[ci]?.subcategories?.[si];
        if (Number.isInteger(ci) && Number.isInteger(si) && subcategory && title) subcategory.title = title;
      });
      (Array.isArray(compact.t) ? compact.t : []).forEach((row) => {
        const ci = Number(row?.[0]), si = Number(row?.[1]), ti = Number(row?.[2]), title = cleanText(row?.[3]);
        const task = cloned[ci]?.subcategories?.[si]?.tasks?.[ti];
        if (Number.isInteger(ci) && Number.isInteger(si) && Number.isInteger(ti) && task && title) task.title = title;
      });
      (Array.isArray(compact.e) ? compact.e : []).forEach((row) => {
        const ci = Number(row?.[0]), si = Number(row?.[1]), ti = Number(row?.[2]);
        const task = cloned[ci]?.subcategories?.[si]?.tasks?.[ti];
        const evidence = naxosEvidenceFromPatch(row?.[3]);
        if (Number.isInteger(ci) && Number.isInteger(si) && Number.isInteger(ti) && task && evidence) task.naxosEvidenceOverride = evidence;
      });
      (Array.isArray(compact.a) ? compact.a : []).forEach((row, index) => {
        const ci = Number(row?.[0]), si = Number(row?.[1]), title = cleanText(row?.[2]);
        const targets = Array.isArray(row?.[3]) ? row[3].map(cleanText).filter(Boolean) : [];
        const subcategory = cloned[ci]?.subcategories?.[si];
        if (!Number.isInteger(ci) || !Number.isInteger(si) || !subcategory || !title || !targets.length) return;
        const evidence = naxosEvidenceFromPatch(row?.[4]);
        subcategory.tasks = Array.isArray(subcategory.tasks) ? subcategory.tasks : [];
        subcategory.tasks.push({
          id: `custom-${ci}-${si}-${index + 1}`,
          title,
          ksbTargets: targets,
          evidenceRequirements: naxosExpandedRequirements(targets, facets),
          evidenceProfile: cleanText(evidence?.profileId) || 'knowledge',
          naxosEvidenceOverride: evidence,
          naxosCustom: true
        });
      });
      return cloned;
    }

    function applyNaxosKsbCustomisations(categories, customisations) {
      const cloned = JSON.parse(JSON.stringify(categories || []));
      const custom = customisations && typeof customisations === 'object' ? customisations : {};
      const titles = custom.titles && typeof custom.titles === 'object' ? custom.titles : {};
      const taskEdits = custom.taskEdits && typeof custom.taskEdits === 'object' ? custom.taskEdits : {};

      cloned.forEach((category, categoryIndex) => {
        const categoryTitle = cleanText(titles.category?.[String(categoryIndex)]);
        if (categoryTitle) category.title = categoryTitle;
        (category.subcategories || []).forEach((subcategory, subcategoryIndex) => {
          const subKey = `${categoryIndex}:${subcategoryIndex}`;
          const subcategoryTitle = cleanText(titles.subcategory?.[subKey]);
          if (subcategoryTitle) subcategory.title = subcategoryTitle;
          (subcategory.tasks || []).forEach((task, taskIndex) => {
            const taskKey = `${categoryIndex}:${subcategoryIndex}:${taskIndex}`;
            const taskTitle = cleanText(titles.task?.[taskKey]);
            if (taskTitle) task.title = taskTitle;
            const evidence = taskEdits[taskKey]?.evidence;
            if (evidence && typeof evidence === 'object') task.naxosEvidenceOverride = evidence;
          });
        });
      });

      const customTasks = Array.isArray(custom.customTasks) ? custom.customTasks : [];
      customTasks.forEach((customTask, index) => {
        const categoryIndex = Number(customTask?.categoryIndex);
        const subcategoryIndex = Number(customTask?.subcategoryIndex);
        if (!Number.isInteger(categoryIndex) || !Number.isInteger(subcategoryIndex)) return;
        const subcategory = cloned[categoryIndex]?.subcategories?.[subcategoryIndex];
        if (!subcategory) return;
        const title = cleanText(customTask?.title);
        const targets = Array.isArray(customTask?.targets) ? customTask.targets.map(cleanText).filter(Boolean) : [];
        if (!title || !targets.length) return;
        const evidence = customTask?.evidence && typeof customTask.evidence === 'object' ? customTask.evidence : null;
        subcategory.tasks = Array.isArray(subcategory.tasks) ? subcategory.tasks : [];
        subcategory.tasks.push({
          id: cleanText(customTask?.id) || `custom-${categoryIndex}-${subcategoryIndex}-${index + 1}`,
          title,
          ksbTargets: targets,
          evidenceRequirements: Array.isArray(customTask?.evidenceRequirements) ? customTask.evidenceRequirements.map(cleanText).filter(Boolean) : [],
          evidenceProfile: cleanText(evidence?.profileId) || 'knowledge',
          naxosEvidenceOverride: evidence,
          naxosCustom: true
        });
      });

      return cloned;
    }

    function naxosResolvedProfile(task, profiles) {
      const override = task?.naxosEvidenceOverride && typeof task.naxosEvidenceOverride === 'object' ? task.naxosEvidenceOverride : null;
      const overrideProfileId = cleanText(override?.profileId);
      const base = profiles[overrideProfileId] || profiles[task?.evidenceProfile] || profiles.knowledge || {};
      if (!override) return base;
      const preferred = Array.isArray(override.preferred) ? override.preferred : null;
      return preferred ? { ...base, preferred } : base;
    }

    function buildNaxosKsbCourse(categories, registry, evidenceRules) {
      const profiles = evidenceRules?.profiles || {};
      return (categories || []).slice(0, 5).map((category) => ({
        label: cleanText(category?.title) || `Route ${category?.id || ''}`.trim(),
        children: (category?.subcategories || []).slice(0, 5).map((subcategory) => ({
          label: cleanText(subcategory?.title) || `Section ${subcategory?.id || ''}`.trim(),
          children: (subcategory?.tasks || []).slice(0, 5).map((task) => {
            const profile = naxosResolvedProfile(task, profiles);
            const requirementItems = naxosTaskRequirements(task, registry, profile);
            return {
              label: cleanText(task?.title) || cleanText(task?.id) || 'Task',
              recommended: naxosPreferredOption(profile),
              alternative: naxosAlternativeOption(profile),
              requirementsHeading: 'What the evidence must show or explain',
              requirementItems,
              requirements: requirementItems.join('\n'),
              ksbTargets: Array.isArray(task?.ksbTargets) ? task.ksbTargets.map(cleanText).filter(Boolean) : [],
              evidenceRequirements: Array.isArray(task?.evidenceRequirements) ? task.evidenceRequirements.map(cleanText).filter(Boolean) : [],
              naxosCustom: Boolean(task?.naxosCustom)
            };
          })
        }))
      })).filter((category) => category.label && category.children.length);
    }

    function uniqueStrings(values) { return [...new Set((values||[]).map(cleanText).filter(Boolean))]; }

    function mappedPathsFromCourse(items, field) {
      const map = {};
      function walk(nodes,path=[]) {
        (nodes||[]).forEach(node=>{
          const next=[...path,node.label];
          if(Array.isArray(node.children)&&node.children.length) walk(node.children,next);
          else (Array.isArray(node[field])?node[field]:[]).forEach(id=>{const key=cleanText(id);if(key)(map[key] ||= []).push(next);});
        });
      }
      walk(items);
      return map;
    }

    function buildKsbCourseMeta(pack, registry, items) {
      const officialItems = registry?.items && typeof registry.items === 'object' ? registry.items : {};
      const qualification = pack?.qualification || {};
      const learning = pack?.learning || qualification?.learning || {};
      return {
        courseType:'ksb',
        qualificationId:cleanText(qualification.id),
        title:cleanText(qualification.title),
        version:cleanText(qualification.version),
        source:cleanText(qualification.source),
        officialItems,
        ksbOrder:Object.keys(officialItems),
        mappings:mappedPathsFromCourse(items,'ksbTargets'),
        learning,
        learningRequiredHours:Number(learning.requiredHours || qualification.otjHours || qualification.learningHours || 0) || null,
        qualification:{ id:cleanText(qualification.id), title:cleanText(qualification.title), version:cleanText(qualification.version), otjHours:Number(qualification.otjHours||0)||null }
      };
    }

    function nvqParentAc(id) {
      const parts=cleanText(id).split('.');
      return parts.length>=3?`${parts[0]}.${parts[1]}.${parts[2]}`:cleanText(id);
    }

    function nvqChildUrl(packUrl,path) {
      return new URL(path,new URL('./',packUrl)).href;
    }

    function flatNvqTasks(categories) {
      return (categories||[]).flatMap(category=>(category.subcategories||[]).flatMap(subcategory=>(subcategory.tasks||[]).map(task=>({task,category,subcategory}))));
    }

    async function loadNvqRequiredTargets(pack, packUrl) {
      const active=new Set(pack?.route?.activeUnits||[]), keep=id=>active.has(String(id||'').split('.')[0]);
      const sourceIds=[];
      for(const sourcePath of (pack.coverageSourcePacks||[])) {
        const sourcePackUrl=nvqChildUrl(packUrl,sourcePath);
        const sourcePack=await fetchNaxosJson(sourcePackUrl);
        const sourceCats=await Promise.all((sourcePack.categoryFiles||[]).map(path=>fetchNaxosJson(nvqChildUrl(sourcePackUrl,path))));
        if(sourcePack.routeMappings){
          const mappings=await fetchNaxosJson(nvqChildUrl(sourcePackUrl,sourcePack.routeMappings));
          for(const [taskId,ids] of Object.entries(mappings.taskMappings||{})){
            const found=flatNvqTasks(sourceCats).find(row=>row.task.id===taskId);
            if(found)found.task.mappedAtomicTargets=uniqueStrings([...(found.task.mappedAtomicTargets||[]),...ids]);
          }
        }
        sourceIds.push(...uniqueStrings(flatNvqTasks(sourceCats).flatMap(({task})=>[...(task.directLo7Targets||[]),...(task.mappedAtomicTargets||[])])).filter(keep));
      }
      for(const sourcePath of (pack.coverageSourceFiles||[])){
        const category=await fetchNaxosJson(nvqChildUrl(packUrl,sourcePath));
        sourceIds.push(...uniqueStrings(flatNvqTasks([category]).flatMap(({task})=>[...(task.directLo7Targets||[]),...(task.mappedAtomicTargets||[])])).filter(keep));
      }
      const requiredDocs=await Promise.all((pack.requiredTargetFiles||[]).map(path=>fetchNaxosJson(nvqChildUrl(packUrl,path))));
      return uniqueStrings([...sourceIds,...requiredDocs.flatMap(doc=>doc.targets||[]),...(pack.requiredAtomicTargets||[])]).filter(keep);
    }

    async function prepareNvqCategories(pack, packUrl, categories, requiredTargets) {
      const cloned=JSON.parse(JSON.stringify(categories||[]));
      const active=new Set(pack?.route?.activeUnits||[]), keep=id=>active.has(String(id||'').split('.')[0]);
      const optionalUnit=String(pack?.route?.optionalUnit||'');
      const optionalCategory=cloned.find(category=>String(category.id)==='5');
      if(optionalCategory&&pack?.qualification?.id==='6570-04')optionalCategory.title=pack.route.title||optionalCategory.title;
      flatNvqTasks(cloned).forEach(({task})=>{
        if(task.primaryUnit==='OPTIONAL')task.primaryUnit=optionalUnit;
        task.directLo7Targets=uniqueStrings(task.directLo7Targets||[]).filter(keep);
        task.mappedAtomicTargets=uniqueStrings(task.mappedAtomicTargets||[]).filter(keep);
        if(requiredTargets.length&&(task.targetPrefixes||[]).length){
          const prefixes=task.targetPrefixes.map(prefix=>String(prefix).replaceAll('$OPTIONAL',optionalUnit));
          const matched=requiredTargets.filter(id=>prefixes.some(prefix=>id===prefix||id.startsWith(`${prefix}.`)));
          task.mappedAtomicTargets=uniqueStrings([...task.mappedAtomicTargets,...matched]).filter(keep);
        }
      });
      if(pack.routeMappings){
        const mappings=await fetchNaxosJson(nvqChildUrl(packUrl,pack.routeMappings));
        for(const [taskId,ids] of Object.entries(mappings.taskMappings||{})){
          const found=flatNvqTasks(cloned).find(row=>row.task.id===taskId);
          if(found)found.task.mappedAtomicTargets=uniqueStrings([...(found.task.mappedAtomicTargets||[]),...ids.filter(keep)]);
        }
      }
      return cloned;
    }

    function resolvedNvqProfile(task, profiles) {
      const title=cleanText(task?.title).toLowerCase(), tags=new Set(task?.tags||[]);
      let id=cleanText(task?.evidenceProfile);
      if(!id&&task?.id==='1.1.4')id='job-information';
      if(!id&&/(dpc|cavity tray|insulation|wall tie|fire barrier|fire break|support angle|wind post|movement joint|weep|vent|reinforcement|soffit|temporary|prop|support|bedding|backfill|pipework|chamber|gully)/i.test(title))id='hidden-work';
      if(!id&&task?.type==='trade')id='practical';
      if(!id&&task?.type==='optional-knowledge')id='knowledge';
      if(!id&&task?.type==='common'&&/^(summarise|explain|discuss|describe)/i.test(title))id='knowledge';
      if(!id&&tags.has('SAFE_WORK'))id='safety';
      if(!id&&tags.has('COMMUNICATION'))id='communication';
      if(!id&&(tags.has('RESOURCES')||tags.has('TOOLS')))id='resources';
      if(!id&&tags.has('QUALITY'))id='quality';
      if(!id&&tags.has('PROGRAMME'))id='programme';
      if(!id)id='knowledge';
      return profiles[id]||profiles.knowledge||{};
    }

    function buildNaxosNvqCourse(categories,evidenceRules) {
      const profiles=evidenceRules?.profiles||{};
      return (categories||[]).slice(0,5).map(category=>({
        label:cleanText(category.title)||`Route ${category.id||''}`.trim(),
        children:(category.subcategories||[]).slice(0,5).map(subcategory=>({
          label:cleanText(subcategory.title)||`Section ${subcategory.id||''}`.trim(),
          children:(subcategory.tasks||[]).slice(0,5).map(task=>{
            const profile=resolvedNvqProfile(task,profiles);
            const requirementItems=naxosTaskRequirements(task,null,profile);
            const atomicTargets=uniqueStrings([...(task.directLo7Targets||[]),...(task.mappedAtomicTargets||[])]);
            const acTargets=uniqueStrings(atomicTargets.map(nvqParentAc));
            return { label:cleanText(task.title)||cleanText(task.id)||'Task', recommended:naxosPreferredOption(profile), alternative:naxosAlternativeOption(profile), requirementsHeading:'What the evidence must show or explain', requirementItems, requirements:requirementItems.join('\n'), acTargets, atomicTargets, primaryUnit:cleanText(task.primaryUnit) };
          })
        }))
      })).filter(category=>category.label&&category.children.length);
    }

    function buildNvqCourseMeta(pack,items,categories,requiredTargets) {
      const qualification=pack?.qualification||{}, units=(pack?.route?.activeUnits||[]).map(String), unitTitles={};
      (qualification.optionalUnits||[]).forEach(unit=>{if(cleanText(unit?.id)&&cleanText(unit?.title))unitTitles[String(unit.id)]=cleanText(unit.title)});
      if(pack?.route?.optionalUnit&&pack?.route?.title)unitTitles[String(pack.route.optionalUnit)]=cleanText(pack.route.title);
      if(qualification.unitTitles&&typeof qualification.unitTitles==='object')Object.assign(unitTitles,qualification.unitTitles);
      const atomsByParent=new Map();
      flatNvqTasks(categories).forEach(({task})=>uniqueStrings([...(task.directLo7Targets||[]),...(task.mappedAtomicTargets||[])]).forEach(atom=>{const parent=nvqParentAc(atom);if(!atomsByParent.has(parent))atomsByParent.set(parent,new Set());atomsByParent.get(parent).add(atom)}));
      const wordingSource=pack.criteriaWording||qualification.criteriaWording||{};
      const criteria=[...atomsByParent.entries()].map(([id,atoms])=>({id,wording:cleanText(wordingSource[id]),atoms:[...atoms].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))})).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
      const suppliedLearning=pack?.learning||qualification?.learning||{};
      const glh=Number(suppliedLearning.requiredHours||qualification.glh||0)||null;
      const learning={type:cleanText(suppliedLearning.type)||'GLH',requiredHours:glh};
      return { courseType:'nvq', qualificationId:cleanText(qualification.id), title:cleanText(qualification.title), source:cleanText(qualification.source), learning, learningRequiredHours:glh, glh, tqt:Number(qualification.tqt||0)||null, units, unitTitles, criteria, mappings:mappedPathsFromCourse(items,'acTargets'), atomicTargetCount:requiredTargets.length, qualification:{id:cleanText(qualification.id),title:cleanText(qualification.title),glh,tqt:Number(qualification.tqt||0)||null} };
    }

    async function importNaxosNvqPack(pointer) {
      scannerStatus.textContent='Loading Naxos NVQ course...';
      const packUrl=new URL(pointer.packUrl,window.location.href).href;
      const pack=await fetchNaxosJson(packUrl);
      const type=cleanText(pack?.qualification?.courseType||pack?.courseType).toLowerCase();
      if(type!=='nvq')throw new Error('The Naxos pack is not an NVQ course.');
      const categoryUrls=(pack.categoryFiles||[]).map(path=>nvqChildUrl(packUrl,path));
      const evidencePath=pack.evidenceRules||pack.evidence?.rulesFile||'../evidence-rules.json';
      const [evidenceRules,...rawCategories]=await Promise.all([fetchNaxosJson(nvqChildUrl(packUrl,evidencePath)),...categoryUrls.map(fetchNaxosJson)]);
      const requiredTargets=await loadNvqRequiredTargets(pack,packUrl);
      const categories=await prepareNvqCategories(pack,packUrl,rawCategories,requiredTargets);
      const items=buildNaxosNvqCourse(categories,evidenceRules);
      if(!items.length)throw new Error('The Naxos NVQ pack contains no course structure.');
      const meta=buildNvqCourseMeta(pack,items,categories,requiredTargets);
      await applyImportedCourse(items,cleanText(pack?.qualification?.title),meta);
      updateArchBars().catch(()=>{});
      closeScanner(false);
    }

    async function importNaxosKsbPack(pointer) {
      scannerStatus.textContent = 'Loading Naxos KSB course...';
      const packUrl = new URL(pointer.packUrl, window.location.href).href;
      const pack = await fetchNaxosJson(packUrl);
      if (cleanText(pack?.courseType).toLowerCase() !== 'ksb') throw new Error('The Naxos pack is not a KSB course.');
      const packDir = new URL('./', packUrl);
      const registryUrl = new URL(pack.ksbRegistry, packDir).href;
      const facetsUrl = new URL(pack.facetRegistry, packDir).href;
      const evidenceRulesUrl = new URL(pack.evidenceRules, packDir).href;
      const categoryUrls = (pack.categoryFiles || []).map((file) => new URL(file, packDir).href);
      const [registry, facets, evidenceRules, ...categories] = await Promise.all([
        fetchNaxosJson(registryUrl),
        fetchNaxosJson(facetsUrl),
        fetchNaxosJson(evidenceRulesUrl),
        ...categoryUrls.map(fetchNaxosJson)
      ]);
      const customisedCategories = pointer.patch
        ? applyNaxosKsbPatch(categories, pointer.patch, facets)
        : applyNaxosKsbCustomisations(categories, pointer.customisations);
      const items = buildNaxosKsbCourse(customisedCategories, registry, evidenceRules);
      if (!items.length) throw new Error('The Naxos KSB pack contains no course structure.');
      const meta = buildKsbCourseMeta(pack, registry, items);
      await applyImportedCourse(items, cleanText(pack?.qualification?.title), meta);
      updateArchBars().catch(() => {});
      closeScanner(false);
    }

    async function applyImportedCourse(items, title = '', meta = {}) {
      try { await window.__eviaDemo?.prepareForFullMode?.('course'); } catch {}
      courseItems = items.slice(0, 5);
      activeCourseTitle = cleanText(title);
      saveCourse(courseItems, activeCourseTitle);
      saveCourseMeta(meta);
      renderCourseTitle();
      closeEvidence();
      resetPills();
      screen.classList.add('active', 'pills-ready');
      setSpeech(menuSpeechLines(1));
      scannerStatus.textContent = 'Naxos course imported.';
      updateBackButton();
    }

    function handleQrRawValue(rawValue) {
      const pointer = parseNaxosPackPointer(rawValue);
      if (pointer) {
        const importer = pointer.courseType === 'nvq' ? importNaxosNvqPack : importNaxosKsbPack;
        importer(pointer).catch((error) => {
          console.error('Could not import Naxos course pack', error);
          scannerStatus.textContent = 'Could not load that Naxos course.';
          scannerBusy = false;
          if (scannerPanel.classList.contains('open') && scannerStream) scannerFrame = requestAnimationFrame(scanFrame);
        });
        return true;
      }
      const items = parseNaxosPayload(rawValue);
      if (items) {
        applyImportedCourse(items,'',{}).then(() => closeScanner(false)).catch((error) => {
          console.error('Could not apply scanned course', error);
          scannerStatus.textContent = 'Could not load that course.';
        });
        return true;
      }
      scannerStatus.textContent = 'That QR code is not a valid Naxos course code.';
      return false;
    }

    async function startScanner() {
      naxosMenu.classList.remove('open');
      naxosArch.setAttribute('aria-expanded', 'false');
      scannerPanel.classList.add('open');
      scannerPanel.setAttribute('aria-hidden', 'false');
      scannerStatus.textContent = 'Point the camera at a Naxos QR code.';
      updateBackButton();

      if (!('BarcodeDetector' in window)) {
        scannerStatus.textContent = 'Live QR scanning is not supported by this browser. You can still try Upload QR Image.';
        return;
      }

      try {
        scannerStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 1280 }
          },
          audio: false
        });
        scannerVideo.srcObject = scannerStream;
        await scannerVideo.play();
        scannerBusy = false;
        scanFrame();
      } catch (error) {
        scannerStatus.textContent = 'Camera access is unavailable. You can use Upload QR Image instead.';
      }
    }

    async function scanFrame() {
      if (!scannerStream || scannerBusy || !scannerPanel.classList.contains('open')) return;
      scannerBusy = true;
      try {
        const detector = new BarcodeDetector({ formats: ['qr_code'] });
        const codes = await detector.detect(scannerVideo);
        if (codes.length && handleQrRawValue(codes[0].rawValue)) return;
      } catch (error) {
        scannerStatus.textContent = 'Unable to read this QR code.';
      }
      scannerBusy = false;
      scannerFrame = requestAnimationFrame(scanFrame);
    }

    async function scanQrImage(file) {
      if (!file) return;
      if (!('BarcodeDetector' in window)) {
        scannerStatus.textContent = 'QR image reading is not supported by this browser.';
        return;
      }
      scannerStatus.textContent = 'Reading QR image...';
      try {
        const bitmap = await createImageBitmap(file);
        const detector = new BarcodeDetector({ formats: ['qr_code'] });
        const codes = await detector.detect(bitmap);
        bitmap.close?.();
        if (!codes.length) {
          scannerStatus.textContent = 'No QR code was found in that image.';
          return;
        }
        handleQrRawValue(codes[0].rawValue);
      } catch (error) {
        scannerStatus.textContent = 'Unable to read that QR image.';
      }
    }

    function closeScanner(reopenNaxos = true) {
      if (scannerFrame) cancelAnimationFrame(scannerFrame);
      scannerFrame = null;
      scannerBusy = false;
      stopStream(scannerStream);
      scannerStream = null;
      scannerVideo.srcObject = null;
      scannerPanel.classList.remove('open');
      scannerPanel.setAttribute('aria-hidden', 'true');
      qrImageInput.value = '';
      if (reopenNaxos) {
        naxosMenu.classList.add('open');
        naxosArch.setAttribute('aria-expanded', 'true');
      }
      updateBackButton();
    }

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) return '0 KB';
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function crc32(bytes) {
      if (!crc32.table) {
        crc32.table = Array.from({ length: 256 }, (_, n) => {
          let c = n;
          for (let k = 0; k < 8; k += 1) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
          return c >>> 0;
        });
      }
      let crc = 0xffffffff;
      for (const byte of bytes) crc = crc32.table[(crc ^ byte) & 0xff] ^ (crc >>> 8);
      return (crc ^ 0xffffffff) >>> 0;
    }

    function dosDateTime(date) {
      const year = Math.max(1980, date.getFullYear());
      const time = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
      const day = ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
      return { time, day };
    }

    function writeUint16(view, offset, value) { view.setUint16(offset, value, true); }
    function writeUint32(view, offset, value) { view.setUint32(offset, value >>> 0, true); }

    function concatBytes(parts) {
      const total = parts.reduce((sum, part) => sum + part.length, 0);
      const output = new Uint8Array(total);
      let offset = 0;
      parts.forEach((part) => { output.set(part, offset); offset += part.length; });
      return output;
    }

    async function createZip(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;

      for (const file of files) {
        const nameBytes = encoder.encode(file.name);
        const data = file.data instanceof Uint8Array ? file.data : new Uint8Array(await file.data.arrayBuffer());
        const crc = crc32(data);
        const dt = dosDateTime(file.date || new Date());

        const localHeader = new Uint8Array(30 + nameBytes.length);
        const localView = new DataView(localHeader.buffer);
        writeUint32(localView, 0, 0x04034b50);
        writeUint16(localView, 4, 20);
        writeUint16(localView, 6, 0);
        writeUint16(localView, 8, 0);
        writeUint16(localView, 10, dt.time);
        writeUint16(localView, 12, dt.day);
        writeUint32(localView, 14, crc);
        writeUint32(localView, 18, data.length);
        writeUint32(localView, 22, data.length);
        writeUint16(localView, 26, nameBytes.length);
        writeUint16(localView, 28, 0);
        localHeader.set(nameBytes, 30);
        localParts.push(localHeader, data);

        const centralHeader = new Uint8Array(46 + nameBytes.length);
        const centralView = new DataView(centralHeader.buffer);
        writeUint32(centralView, 0, 0x02014b50);
        writeUint16(centralView, 4, 20);
        writeUint16(centralView, 6, 20);
        writeUint16(centralView, 8, 0);
        writeUint16(centralView, 10, 0);
        writeUint16(centralView, 12, dt.time);
        writeUint16(centralView, 14, dt.day);
        writeUint32(centralView, 16, crc);
        writeUint32(centralView, 20, data.length);
        writeUint32(centralView, 24, data.length);
        writeUint16(centralView, 28, nameBytes.length);
        writeUint16(centralView, 30, 0);
        writeUint16(centralView, 32, 0);
        writeUint16(centralView, 34, 0);
        writeUint16(centralView, 36, 0);
        writeUint32(centralView, 38, 0);
        writeUint32(centralView, 42, offset);
        centralHeader.set(nameBytes, 46);
        centralParts.push(centralHeader);
        offset += localHeader.length + data.length;
      }

      const centralDirectory = concatBytes(centralParts);
      const end = new Uint8Array(22);
      const endView = new DataView(end.buffer);
      writeUint32(endView, 0, 0x06054b50);
      writeUint16(endView, 4, 0);
      writeUint16(endView, 6, 0);
      writeUint16(endView, 8, files.length);
      writeUint16(endView, 10, files.length);
      writeUint32(endView, 12, centralDirectory.length);
      writeUint32(endView, 16, offset);
      writeUint16(endView, 20, 0);

      return new Blob([...localParts, centralDirectory, end], { type: 'application/zip' });
    }

    async function downloadPortfolioZip() {
      portfolioStatus.textContent = 'Building portfolio ZIP...';
      try {
        const entries = await getPortfolioEntries();
        if (!entries.length && !learningEntries.length) {
          portfolioStatus.textContent = 'There is no evidence or learning to download yet.';
          return;
        }

        const metadata = entries.map(({ blob, ...entry }) => ({ ...entry, size: blob?.size || 0 }));
        const files = entries.map((entry) => ({
          name: `evidence/${entry.fileName}`,
          data: entry.blob,
          date: new Date(entry.createdAt)
        }));
        if (learningEntries.length) {
          files.push({
            name: 'learn/learning.json',
            data: new TextEncoder().encode(JSON.stringify({ entries: learningEntries }, null, 2)),
            date: new Date()
          });
          learningEntries.forEach((entry) => {
            files.push({
              name: `learn/${safeFilename(entry.evidenceLabel || 'learning')}-${safeFilename(entry.id || String(Date.now()))}.txt`,
              data: new TextEncoder().encode(entry.text || ''),
              date: new Date(entry.createdAt || Date.now())
            });
          });
        }
        files.unshift({
          name: 'course.json',
          data: new TextEncoder().encode(JSON.stringify({ course: { items: courseItems } }, null, 2)),
          date: new Date()
        });
        files.unshift({
          name: 'portfolio.json',
          data: new TextEncoder().encode(JSON.stringify({
            exportedAt: new Date().toISOString(),
            learner: officialLearnerProfile(),
            evidence: metadata,
            learning: learningEntries
          }, null, 2)),
          date: new Date()
        });

        if (globalThis.EviaEvidencePackViewer?.buildViewerFiles) {
          try {
            const viewerFiles = await globalThis.EviaEvidencePackViewer.buildViewerFiles(entries, {
              scopeType: 'portfolio',
              scopeLabel: 'Complete portfolio',
              course: typeof activeCourseTitle !== 'undefined' ? activeCourseTitle : '',
              learner: typeof officialLearnerProfile === 'function' ? officialLearnerProfile() : {},
              learning: typeof learningEntries !== 'undefined' && Array.isArray(learningEntries) ? learningEntries : []
            });
            files.push(...viewerFiles);
          } catch (viewerError) {
            console.warn('Could not add the self-contained Evia evidence viewer to the portfolio ZIP.', viewerError);
          }
        }

        const zipBlob = await createZip(files);
        const link = document.createElement('a');
        const url = URL.createObjectURL(zipBlob);
        link.href = url;
        link.download = `Evia-Portfolio-${new Date().toISOString().slice(0, 10)}.zip`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        portfolioStatus.textContent = 'Portfolio ZIP ready.';
      } catch (error) {
        portfolioStatus.textContent = 'Could not build the portfolio ZIP.';
      }
    }

    function prepareChatOptions(options = []) {
      const list = Array.isArray(options) ? options.filter(Boolean).map((option) => ({ ...option })) : [];
      if (!list.length) return [];
      if (list.length > 4) {
        chatOptionOverflow = list.slice(3);
        return [...list.slice(0, 3), { label: 'More', action: 'chat-more-options' }];
      }
      chatOptionOverflow = [];
      const usedActions = new Set(list.map((option) => option.action));
      const usedLabels = new Set(list.map((option) => option.label));
      const fallbacks = [
        { label: 'Quick Review', action: 'quick-review' },
        { label: 'Teach Me', action: 'teach-me' },
        { label: 'Test Me', action: 'test-me' },
        { label: 'Main menu', action: 'chat-home' }
      ];
      for (const fallback of fallbacks) {
        if (list.length >= 4) break;
        if (usedActions.has(fallback.action) || usedLabels.has(fallback.label)) continue;
        list.push(fallback);
        usedActions.add(fallback.action);
        usedLabels.add(fallback.label);
      }
      return list.slice(0, 4);
    }

    function courseLeaves(items = courseItems, path = [], result = []) {
      items.forEach((node) => {
        const nextPath = [...path, node.label];
        if (Array.isArray(node.children) && node.children.length) courseLeaves(node.children, nextPath, result);
        else result.push({ node, path: nextPath });
      });
      return result;
    }

    function courseProgressPercent() {
      if (!learnerProfile.startDate || !learnerProfile.endDate) return null;
      const start = Date.parse(`${learnerProfile.startDate}T00:00:00Z`);
      const end = Date.parse(`${learnerProfile.endDate}T00:00:00Z`);
      if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return null;
      const now = Date.now();
      return Math.max(0, Math.min(100, ((now - start) / (end - start)) * 100));
    }

    function escapeDetailHtml(value) {
      return String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    }

    function parseCourseDate(value) {
      const stamp = Date.parse(`${cleanText(value)}T00:00:00Z`);
      return Number.isFinite(stamp) ? new Date(stamp) : null;
    }

    function addUtcMonths(date, months) {
      const d = new Date(date.getTime());
      const originalDay = d.getUTCDate();
      d.setUTCDate(1);
      d.setUTCMonth(d.getUTCMonth() + months);
      const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
      d.setUTCDate(Math.min(originalDay, last));
      return d;
    }

    function monthsDaysBetween(start, end) {
      if (!start || !end || end <= start) return { months: 0, days: 0 };
      let months = (end.getUTCFullYear() - start.getUTCFullYear()) * 12 + end.getUTCMonth() - start.getUTCMonth();
      let anchor = addUtcMonths(start, months);
      if (anchor > end) { months -= 1; anchor = addUtcMonths(start, months); }
      const days = Math.max(0, Math.floor((end - anchor) / 86400000));
      return { months: Math.max(0, months), days };
    }

    function formatMonthsDays(value) {
      const parts = [];
      if (value.months) parts.push(`${value.months} month${value.months === 1 ? '' : 's'}`);
      parts.push(`${value.days} day${value.days === 1 ? '' : 's'}`);
      return parts.join(' ');
    }

    function courseMetaMappings() {
      const mappings = activeCourseMeta?.mappings;
      if (mappings && typeof mappings === 'object') return mappings;
      const out = {};
      courseLeaves().forEach(({node,path}) => {
        const ids = [...(Array.isArray(node.ksbTargets) ? node.ksbTargets : []), ...(Array.isArray(node.acTargets) ? node.acTargets : [])];
        ids.forEach(id => { const key=cleanText(id); if(!key)return; (out[key] ||= []).push(path); });
      });
      return out;
    }

    function targetProgress(id) {
      const raw = courseMetaMappings()[id] || [];
      const unique = [];
      const seen = new Set();
      raw.forEach((path) => {
        if (!Array.isArray(path) || !path.length) return;
        const key = evidencePathKey(path);
        if (seen.has(key)) return;
        seen.add(key);
        unique.push(path);
      });
      const total = unique.length;
      const completed = unique.filter((path) => completedEvidencePaths.has(evidencePathKey(path))).length;
      const fraction = total ? completed / total : 0;
      return { completed, total, fraction, percent: fraction * 100, complete: total > 0 && completed >= total, paths: unique };
    }

    function targetIsMet(id) {
      return targetProgress(id).complete;
    }

    function criterionProgressMarkup(id) {
      const progress = targetProgress(id);
      if (!progress.total) return '';
      if (progress.complete) return '<span class="criterion-progress-mark criterion-progress-tick" aria-hidden="true">✓</span>';
      return `<span class="criterion-progress-mark criterion-progress-ring" style="--criterion-progress:${progress.fraction * 360}deg" aria-hidden="true"></span>`;
    }

    function naturalTargetSort(a,b) {
      const rank={K:0,S:1,B:2};
      const aa=String(a),bb=String(b), ar=rank[aa[0]] ?? 5, br=rank[bb[0]] ?? 5;
      return ar-br || aa.localeCompare(bb, undefined, {numeric:true,sensitivity:'base'});
    }

    function inferredCourseMeta() {
      const mappings = courseMetaMappings();
      const ids = Object.keys(mappings);
      if (activeCourseMeta && Object.keys(activeCourseMeta).length) return activeCourseMeta;
      const isNvq = ids.some(id => /^\d+\./.test(id));
      return { courseType: isNvq ? 'nvq' : 'ksb', mappings, officialItems: {}, ksbOrder: ids.sort(naturalTargetSort), criteria: ids.map(id=>({id,wording:''})) };
    }

    function nvqCriteria(meta, unit) {

    function nvqUnitProgress(meta, unit) {
      const criteria = nvqCriteria(meta, unit);
      if (!criteria.length) return { fraction: 0, complete: false, completedCriteria: 0, totalCriteria: 0 };
      const progress = criteria.map((item) => targetProgress(item.id));
      const fraction = progress.reduce((sum, item) => sum + item.fraction, 0) / criteria.length;
      const complete = progress.every((item) => item.complete);
      return { fraction, complete, completedCriteria: progress.filter((item) => item.complete).length, totalCriteria: criteria.length };
    }

    async function runQuickReview() {
      const leaves = courseLeaves();
      if (!leaves.length) {
        await chatSay('I need your Naxos course first. Once it is loaded, I can review your progress.', mainChatOptions());
        return;
      }

      const coveredLeaves = leaves.filter((leaf) => completedEvidencePaths.has(evidencePathKey(leaf.path)));
      const coverage = leaves.length ? Math.round((coveredLeaves.length / leaves.length) * 100) : 0;
      const elapsed = courseProgressPercent();
      let paceMessage = `You have completed ${coveredLeaves.length} of ${leaves.length} evidence areas (${coverage}%).`;

      if (elapsed !== null) {
        const elapsedRounded = Math.round(elapsed);
        const targetCount = Math.ceil((elapsed / 100) * leaves.length);
        const catchUp = Math.max(0, targetCount - coveredLeaves.length);
        if (coverage + 5 >= elapsedRounded) {
          paceMessage += ` You're about ${elapsedRounded}% through the course, so you're on track.`;
        } else {
          paceMessage += ` You're about ${elapsedRounded}% through the course, so there are a few areas to catch up.`;
          if (catchUp) paceMessage += ` Around ${catchUp} more evidence area${catchUp === 1 ? '' : 's'} would bring you closer to target.`;
        }
      } else {
        paceMessage += ' Add your course dates and I can compare this with where you should be.';
      }
      await chatSay(paceMessage);

      const areaStats = courseItems.map((area, index) => {
        const areaLeaves = courseLeaves([area]);
        const covered = areaLeaves.filter((leaf) => completedEvidencePaths.has(evidencePathKey(leaf.path))).length;
        return { label: area.label, index, total: areaLeaves.length, covered, rate: areaLeaves.length ? covered / areaLeaves.length : 0 };
      }).filter((area) => area.total);
      areaStats.sort((a, b) => b.rate - a.rate);
      const strongest = areaStats[0];
      const weakest = areaStats[areaStats.length - 1];

      if (!strongest || !weakest) {
        await chatSay('Keep adding evidence and I’ll be able to show you where to focus next.', mainChatOptions());
        return;
      }

      if (strongest.rate > 0 && strongest.label !== weakest.label) {
        await chatSay(`${strongest.label} is looking strongest right now.`);
      }

      if (weakest.rate < 1) {
        await chatSay(`${weakest.label} needs the most attention. Want me to take you there?`, [
          { label: 'Go there', action: 'review-area', value: weakest.label },
          { label: 'Teach Me', action: 'teach-me' },
          { label: 'Test Me', action: 'test-me' },
          { label: 'Not now', action: 'chat-home' }
        ]);
      } else {
        await chatSay('Everything currently mapped has evidence. Nice work.', mainChatOptions());
      }
    }

    function weeklyCheckInMondayKey(date = new Date()) {

      const year = day.getFullYear();
      const month = String(day.getMonth() + 1).padStart(2, '0');
      const dateNumber = String(day.getDate()).padStart(2, '0');
      return `${year}-${month}-${dateNumber}`;
    }

    function shuffledConfidenceTasks(count = 3) {
      const leaves = courseLeaves().filter((leaf) => leaf?.node && Array.isArray(leaf.path) && leaf.path.length);
      const shuffle = (items) => {
        const copy = items.slice();
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };
      const incomplete = leaves.filter((leaf) => !completedEvidencePaths.has(evidencePathKey(leaf.path)));
      const complete = leaves.filter((leaf) => completedEvidencePaths.has(evidencePathKey(leaf.path)));
      return [...shuffle(incomplete), ...shuffle(complete)].slice(0, count).map((leaf) => ({
        label: cleanText(leaf.node?.label || leaf.path[leaf.path.length - 1]),
        path: leaf.path.slice()
      }));
    }

    async function handleChatAction(action, value, label) {
      if (!action) return;
      if (!['call-assessor', 'call-safeguarding'].includes(action)) {
        chatNavStack.push(captureChatSnapshot());
      }
      appendUserBubble(label);

      if (action === 'chat-home') {
        checkInState = null;
        teachState = null;
        testState = null;
        await chatSay('What do you want to do?', mainChatOptions());
        return;
      }
      if (action === 'quick-review') { await runQuickReview(); return; }
      if (action === 'review-area') { await openQuickReviewArea(value); return; }
      if (action === 'check-in') { await startCheckIn(); return; }
      if (action === 'teach-me') { await startTeachMe(); return; }
      if (action === 'test-me') { await startTestMe(); return; }

      if (action === 'chat-more-options') {
        const more = chatOptionOverflow.slice();
        chatOptionOverflow = [];
        await chatSay('More options', more);
        return;
      }
      if (action === 'check-wellbeing') {
        if (checkInState) checkInState.wellbeing = value;
        if (['struggling', 'not-well'].includes(value)) await askSupportChoice();
        else await askConfidenceTask();
        return;
      }
      if (action === 'support-continue' || action === 'support-no') { await askConfidenceTask(); return; }
      if (action === 'call-assessor') {
        dialSavedNumber(learnerProfile.assessorPhone, 'Add your assessor phone number in Learner Profile before using this call option.');
        return;
      }
      if (action === 'call-safeguarding') {
        dialSavedNumber(learnerProfile.safeguardingPhone, 'Add the safeguarding phone number in Learner Profile before using this call option.');
        return;
      }
      if (action === 'check-confidence') {
        if (checkInState) {
          const task = checkInState.tasks?.[checkInState.taskIndex];
          if (task && ['not-confident', 'a-little'].includes(value)) checkInState.lowTasks.push(task);
          checkInState.taskIndex += 1;
        }
        await askConfidenceTask();
        return;
      }
      if (action === 'check-open-task') {
        try {
          const path = JSON.parse(decodeURIComponent(value));
          closeChat();
          await goToEvidencePath(path);
        } catch (error) {}
        return;
      }
      if (action === 'teach-pick') { await teachPick(Number(value)); return; }
      if (action === 'test-category') {
        testState = { category: value, index: 0, score: 0 };
        await askTestQuestion();
        return;
      }
      if (action === 'test-answer') {
        const bank = testBankForCategory(testState?.category);
        const question = bank[testState?.index || 0];
        if (!testState || !question) return;
        const correct = Number(value) === question.correct;
        if (correct) testState.score += 1;
        testState.index += 1;
        await chatSay(correct ? "Yep — that's right." : `Not quite — it's ${question.a[question.correct]}.`);
        await askTestQuestion();
      }
    }

    function showSupabasePlaceholder() {
      portfolioStatus.textContent = 'Upload Portfolio is ready to connect when the website endpoint is added. The upload package will include your portfolio evidence and Learn entries; everything remains stored locally until then.';
    }

    function updateBackButton() {
      const shouldShow =
        chatPanel.classList.contains('open') ||
        scannerPanel.classList.contains('open') ||
        portfolioPanel.classList.contains('open') ||
        archDetailPanel.classList.contains('open') ||
        naxosMenu.classList.contains('open') ||
        captureMode !== null ||
        screen.classList.contains('completion-open') ||
        screen.classList.contains('evidence-open') ||
        screen.classList.contains('active');
      backButton.classList.toggle('show', shouldShow);
    }

    function goBackOneStep() {
      stopTalking(false);
      if (chatPanel.classList.contains('open')) {
        if (chatNavStack.length) {
          restoreChatSnapshot(chatNavStack.pop());
        } else {
          closeChat();
        }
        return;
      }
      if (scannerPanel.classList.contains('open')) {
        closeScanner(true);
        return;
      }
      if (archDetailPanel.classList.contains('open')) {
        if (archDetailStack.length) restoreArchView();
        else closeArchDetail();
        return;
      }
      if (portfolioPanel.classList.contains('open')) {
        if (portfolioViewerOpen) {
          closeEvidenceViewer();
          return;
        }
        if (profileViewOpen) {
          closeLearnerProfile();
          return;
        }
        closePortfolio(true);
        return;
      }
      if (naxosMenu.classList.contains('open')) {
        naxosMenu.classList.remove('open');
        naxosArch.setAttribute('aria-expanded', 'false');
        updateBackButton();
        return;
      }
      if (screen.classList.contains('completion-open')) {
        returnToHomeFromCompletion();
        return;
      }
      if (captureMode !== null && screen.classList.contains('evidence-open')) {
        cancelEvidenceCollectionToChoices();
        return;
      }
      if (screen.classList.contains('evidence-open')) {
        closeEvidence();
        setSpeech(menuSpeechLines(menuLevel));
        renderPills(true);
        screen.classList.add('pills-ready');
        return;
      }
      if (screen.classList.contains('active') && menuLevel > 1) {
        menuPath.pop();
        menuLevel -= 1;
        currentItems = getItemsAtPath(menuPath);
        setSpeech(menuSpeechLines(menuLevel));
        renderPills(true);
        screen.classList.add('pills-ready');
        return;
      }
      if (screen.classList.contains('active')) deactivateHome();
    }

    eviaStage.addEventListener('click', toggleHome);
    eviaStage.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleHome();
      }
    });

    backButton.addEventListener('click', goBackOneStep);
    chatButton.addEventListener('click', openChat);
    chatExitButton.addEventListener('click', closeChat);
    chatOptions.addEventListener('click', (event) => {
      const button = event.target.closest('[data-chat-action]');
      if (!button) return;
      handleChatAction(button.dataset.chatAction, button.dataset.chatValue, button.textContent.trim());
    });

    pillStack.addEventListener('click', handlePillActivation);
    pillStack.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        const pill = event.target.closest('.pill');
        if (!pill) return;
        event.preventDefault();
        openNextPillSet(pill);
      }
    });

    evidenceTop.addEventListener('click', (event) => {
      const choice = event.target.closest('.evidence-choice');
      if (!choice) return;
      const option = choice.dataset.evidenceChoice === 'alternative' ? activeEvidence?.alternative : activeEvidence?.recommended;
      beginEvidenceCollection(option, choice.dataset.evidenceHeading || 'Evidence');
    });

    learnNo.addEventListener('click', returnToHomeFromCompletion);
    learnYes.addEventListener('click', openLearnReflection);
    saveLearnReflection.addEventListener('click', storeLearnReflection);

    courseArch.addEventListener('click', renderCoursePage);
    attendanceArch.addEventListener('click', renderAttendPage);
    learnArch.addEventListener('click', renderLearnPage);
    archDetailContent.addEventListener('click', handleArchDetailAction);

    naxosArch.addEventListener('click', toggleNaxosMenu);
    naxosMenu.addEventListener('click', (event) => {
      const action = event.target.closest('[data-naxos-action]')?.dataset.naxosAction;
      if (action === 'scan') startScanner();
      if (action === 'portfolio') openPortfolio();
    });

    qrImageButton.addEventListener('click', () => qrImageInput.click());
    qrImageInput.addEventListener('change', () => scanQrImage(qrImageInput.files?.[0]));

    portfolioList.addEventListener('click', (event) => {
      const item = event.target.closest('[data-evidence-id]');
      if (!item) return;
      openEvidenceViewer(portfolioEntriesById.get(item.dataset.evidenceId));
    });
    portfolioList.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const item = event.target.closest('[data-evidence-id]');
      if (!item) return;
      event.preventDefault();
      openEvidenceViewer(portfolioEntriesById.get(item.dataset.evidenceId));
    });
    portfolioEditEvidence.addEventListener('click', () => editActiveEvidence().catch(() => { portfolioViewerStatus.textContent = 'Could not update this evidence.'; }));
    portfolioEditFileInput.addEventListener('change', () => replaceActiveEvidenceFile(portfolioEditFileInput.files?.[0]).catch(() => { portfolioViewerStatus.textContent = 'Could not update this evidence.'; }));
    portfolioDeleteEvidence.addEventListener('click', deleteActiveEvidence);

    learnerProfileButton.addEventListener('click', openLearnerProfile);
    learnerProfileForm.addEventListener('submit', (event) => {
      event.preventDefault();
      saveLearnerProfile({
        firstName: profileFirstName.value,
        lastName: profileLastName.value,
        nickname: profileNickname.value,
        startDate: profileStartDate.value,
        endDate: profileEndDate.value,
        assessorName: profileAssessorName.value,
        assessorPhone: profileAssessorPhone.value,
        safeguardingPhone: profileSafeguardingPhone.value
      });
      profileStatus.textContent = 'Profile saved.';
      refreshGuidanceStatic();
      updateArchBars().catch(() => {});
    });

    downloadPortfolio.addEventListener('click', downloadPortfolioZip);
    uploadPortfolio.addEventListener('click', showSupabasePlaceholder);

    resetPills();
    renderCourseTitle();
    applyLook();
    startTextFitObserver();
    updateArchBars().catch(() => {});
    speak(homeSpeechLines());
    setTimeout(scheduleLooks, 1800);
    setTimeout(scheduleBlinks, 2200);
    setTimeout(scheduleAccents, 4200);
    updateBackButton();

    if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopCapture();
        if (scannerPanel.classList.contains('open')) closeScanner(false);
      } else {
        applyLook();
      }
    });
  </script>
  <!-- Evia runtime: the manifest is the single ordered source for current modules. -->
<script>
  (globalThis.EVIA_RUNTIME_SCRIPTS || []).slice(1).forEach((src) => {
    document.write('<script src="' + src + '"><\/script>');
  });
</script>

</body>
</html>
